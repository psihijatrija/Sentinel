name = "sentinel-threat-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Free plan - no account_id needed for local dev
# Set account_id after creating your Cloudflare account:
# account_id = "your-account-id-here"

[observability]
enabled = true

# v2.1.7 B6: Durable rate limiting (survives isolate recycling)
# This backstops the in-memory per-isolate rate limiter which resets on cold starts.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "0" # Auto-assigned by Cloudflare on deploy
simple = { limit = 60, period = 60 }

# Mutating /report/* routes require a deployment-only credential distinct from
# the public lookup compatibility credential. Provision it with:
# wrangler secret put SENTINEL_REPORT_SHARED_SECRET
# Configure the matching client ReportingProxySharedSecret in its encrypted store.
# Evidence anchors additionally need an EVIDENCE_STORE KV namespace binding.
# Never put deployment secret values in this file.
