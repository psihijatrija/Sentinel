name: Release

# Publishes a GitHub release with the compiled installer whenever the released
# version changes on main.
#
# Why "on version.txt change" instead of auto-bumping in CI:
# Sentinel's versioning policy (see .kiro/steering/workflow.md) is strict - the version
# is bumped by exactly one patch, locally, by installer/release.ps1, and version.txt is the
# single source of truth. Having CI bump the version would fight that policy and cause
# divergence. Instead CI reacts to a version.txt change: it builds the installer for the
# version already committed and publishes it, but only if the v<version> tag/release does
# not already exist. That makes it a safe no-op when a local `release.ps1` / `push.ps1`
# run already published the same version, and it fills in the release when only the commit
# was pushed (e.g. a plain `git push`).

on:
  push:
    branches: [ main, master ]
    paths:
      - 'version.txt'
  workflow_dispatch: {}   # allow manual re-run for the current version.txt

permissions:
  contents: write         # required to create tags and releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version.txt is not MAJOR.MINOR.PATCH: '$v'" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $v"

      - name: Check if release already exists
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - nothing to do."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Release $tag does not exist - will build and publish."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # The .NET 10 SDK builds every project: the net48 projects consume 8.0-pinned NuGet
      # packages (no 8.0 SDK needed) and the tools target net10.0. Matches build.yml.
      - name: Setup .NET 10
        if: steps.exists.outputs.skip == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # build.ps1 requires the Inno Setup compiler (ISCC.exe). The Chocolatey package
      # installs it to C:\Program Files (x86)\Inno Setup 6\ - one of the paths build.ps1
      # already probes.
      - name: Install Inno Setup
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Reuse the exact local build path: stamps every csproj + setup.iss from version.txt,
      # publishes Service + Agent (net48, framework-dependent), compiles the installer with
      # Inno Setup, and copies it to releases\<version>\.
      - name: Build installer
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: ./installer/build.ps1

      - name: Verify installer artifact
        if: steps.exists.outputs.skip == 'false'
        id: artifact
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $path = "releases/$v/SentinelSetup-$v.exe"
          if (-not (Test-Path $path)) { throw "Installer not found at $path" }
          $sizeMb = [math]::Round((Get-Item $path).Length / 1MB, 2)
          Write-Host "Installer: $path ($sizeMb MB)"
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Extract the CHANGELOG section for this version as release notes (same behavior as
      # installer/release.ps1's Get-ChangelogNotes). Falls back to a one-liner if absent.
      - name: Extract release notes
        if: steps.exists.outputs.skip == 'false'
        id: notes
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $fallback = "Sentinel $v. See docs/CHANGELOG.md for details."
          $out = "release-notes.md"
          $changelog = "docs/CHANGELOG.md"
          if (-not (Test-Path $changelog)) {
            Set-Content -Path $out -Value $fallback -Encoding UTF8
          } else {
            $lines = Get-Content $changelog
            $escaped = [regex]::Escape($v)
            $headingRe = "^##\s*\[$escaped\]"
            $anyHeadingRe = '^##\s*\['
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match $headingRe) { $start = $i; break } }
            if ($start -lt 0) {
              Set-Content -Path $out -Value $fallback -Encoding UTF8
            } else {
              $body = New-Object System.Collections.Generic.List[string]
              for ($j = $start + 1; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match $anyHeadingRe) { break }
                $body.Add($lines[$j])
              }
              $text = ($body -join "`n").Trim()
              if ([string]::IsNullOrWhiteSpace($text)) {
                Set-Content -Path $out -Value $fallback -Encoding UTF8
              } else {
                Set-Content -Path $out -Value "## Sentinel $v`n`n$text" -Encoding UTF8
              }
            }
          }
          Write-Host "Notes written to $out"

      - name: Create GitHub release
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" "${{ steps.artifact.outputs.path }}" `
            --title "Sentinel $v" `
            --notes-file release-notes.md `
            --target ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
