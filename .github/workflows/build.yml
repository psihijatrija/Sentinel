name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # The .NET 10 SDK builds everything: the net48 projects (core/service/agent/tests)
    # consume 8.0-pinned NuGet packages but do NOT need the 8.0 SDK, and the MlTrainer
    # tool targets net10.0. Verified locally with only 10.0.400 installed.
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node for Worker tests
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Worker tests
      working-directory: worker
      run: npm test

    - name: Dashboard response rendering tests
      run: node --test tests/dashboard-response.test.cjs

    - name: Restore dependencies
      run: dotnet restore Sentinel.sln

    # Fail the build if warnings reappear - the codebase currently builds 0-warning
    # and we want to keep it that way. -warnaserror turns any new warning into a red CI.
    - name: Build (warnings as errors)
      run: dotnet build Sentinel.sln -c Release --no-restore -warnaserror

    - name: Test
      run: >
        dotnet test tests/Sentinel.Tests/Sentinel.Tests.csproj
        -c Release --no-build --verbosity normal
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ${{ github.workspace }}/TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ github.workspace }}/TestResults/*.trx
        if-no-files-found: ignore

    - name: Summarize Windows test failures
      if: always()
      shell: pwsh
      run: |
        $resultPath = Join-Path $env:GITHUB_WORKSPACE 'TestResults/test-results.trx'
        if (Test-Path $resultPath) {
          [xml]$trx = Get-Content $resultPath -Raw
          $c = $trx.TestRun.ResultSummary.Counters
          "Windows Framework tests: executed=$($c.executed), passed=$($c.passed), failed=$($c.failed), notExecuted=$($c.notExecuted)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($result in $trx.SelectNodes("//*[local-name()='UnitTestResult'][@outcome='Failed']")) {
            $message = $result.SelectSingleNode(".//*[local-name()='Message']")
            $stack = $result.SelectSingleNode(".//*[local-name()='StackTrace']")
            Write-Host "Failed: $($result.testName)"
            "Failed: $($result.testName)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            if ($message) {
              Write-Host $message.InnerText
              $message.InnerText | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
            if ($stack) { $stack.InnerText | Out-File $env:GITHUB_STEP_SUMMARY -Append }
          }
        }

    # Coverage runs as its own step: coverlet.msbuild instruments at test-build time, so it
    # cannot use the --no-build artifacts from the Test step above. It builds+tests again with
    # instrumentation and emits a cobertura report. Not gated on a threshold yet (the baseline
    # is ~40% line on Sentinel.Core); the number is published so regressions are visible.
    - name: Coverage
      run: >
        dotnet test tests/Sentinel.Tests/Sentinel.Tests.csproj
        -c Release
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=cobertura

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ github.workspace }}/tests/Sentinel.Tests/TestResults/coverage.cobertura.xml
        if-no-files-found: ignore
