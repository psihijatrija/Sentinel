name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  route:
    name: Select validation workflow
    runs-on: windows-latest
    outputs:
      release: ${{ steps.route.outputs.release }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Route version changes to the release gate
      id: route
      shell: pwsh
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        $release = $false
        if ($env:EVENT_NAME -eq 'push') {
          $parents = @(git rev-list --max-count=2 HEAD)
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect commit parents" }
          if ($parents.Count -ge 2) {
            $changed = @(git diff --name-only HEAD^ HEAD)
            if ($LASTEXITCODE -ne 0) { throw "Cannot determine changed files" }
            $release = $changed -contains 'version.txt'
          }
          $global:LASTEXITCODE = 0
        }
        "release=$($release.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append
        if ($release) {
          "This version change is built and tested by the Release workflow before packaging. The ordinary suite is skipped to avoid duplicate runs." | Out-File $env:GITHUB_STEP_SUMMARY -Append
        }

  build:
    needs: route
    if: needs.route.outputs.release != 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # The .NET 10 SDK builds everything: the net48 projects (core/service/agent/tests)
    # consume 8.0-pinned NuGet packages but do NOT need the 8.0 SDK, and the MlTrainer
    # tool targets net10.0. Verified locally with only 10.0.400 installed.
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node for Worker tests
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Worker tests
      working-directory: worker
      run: npm test

    - name: Restore dependencies
      run: dotnet restore Sentinel.sln

    # Fail the build if warnings reappear - the codebase currently builds 0-warning
    # and we want to keep it that way. -warnaserror turns any new warning into a red CI.
    - name: Build (warnings as errors)
      run: dotnet build Sentinel.sln -c Release --no-restore -warnaserror

    # Collect coverage and TRX results in one execution of the Framework suite.
    # A second uninstrumented run added waiting without checking different behavior.
    - name: Windows Framework tests with coverage
      run: >
        dotnet test tests/Sentinel.Tests/Sentinel.Tests.csproj
        -c Release --verbosity normal
        --logger "trx;LogFileName=test-results.trx"
        --results-directory ${{ github.workspace }}/TestResults
        /p:CollectCoverage=true
        /p:CoverletOutputFormat=cobertura

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ github.workspace }}/TestResults/*.trx
        if-no-files-found: ignore

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ github.workspace }}/tests/Sentinel.Tests/TestResults/coverage.cobertura.xml
        if-no-files-found: ignore
